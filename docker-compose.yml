version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: nesc-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: nesc_db
    ports:
      - "3307:3306" # 如果这里报错，说明你电脑以前装过MySQL占用了3306，改成 "3307:3306"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

volumes:
  mysql_data:
